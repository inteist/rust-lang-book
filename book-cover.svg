<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&amp;family=Space+Mono:wght@400;700&amp;display=swap");
    </style>

    <linearGradient id="spaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0515"/>
      <stop offset="40%" stop-color="#210f3c"/>
      <stop offset="80%" stop-color="#561f55"/>
      <stop offset="100%" stop-color="#e43e5c"/>
    </linearGradient>

    <linearGradient id="planetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>

    <filter id="gear-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <mask id="holes">
      <rect x="-60" y="-60" width="120" height="120" fill="white"/>
      <circle id="hole" cy="-40" r="3" fill="black" />
      <use href="#hole" transform="rotate(72)" />
      <use href="#hole" transform="rotate(144)" />
      <use href="#hole" transform="rotate(216)" />
      <use href="#hole" transform="rotate(288)" />
    </mask>

    <polygon id="cog" stroke="currentColor" fill="currentColor" stroke-width="3" stroke-linejoin="round" points="46,3 51,0 46,-3" />
    <polygon id="mount" stroke="currentColor" fill="currentColor" stroke-width="6" stroke-linejoin="round" points="-7,-42 0,-35 7,-42" />
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#spaceGrad)" />

  <!-- Stars -->
  <g fill="#FFF" opacity="0.6">
    <circle cx="100" cy="150" r="2"/>
    <circle cx="250" cy="80" r="3" opacity="0.8"/>
    <circle cx="650" cy="120" r="1.5"/>
    <circle cx="720" cy="300" r="4" fill="#FF7B9C"/>
    <circle cx="80" cy="400" r="2" opacity="0.4"/>
    <circle cx="150" cy="550" r="3" fill="#F4CE4A"/>
    <circle cx="700" cy="650" r="2"/>
    <circle cx="600" cy="450" r="1"/>
    <circle cx="340" cy="350" r="2.5"/>
    <circle cx="450" cy="100" r="1.5"/>
    <path d="M 600 150 L 500 250" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 4 10" opacity="0.5" />
  </g>

  <!-- Background Floating Code -->
  <g font-family="'Space Mono', monospace" font-size="20" fill="#00F0FF" opacity="0.25">
    <text x="120" y="250" transform="rotate(-15, 120, 250)">&lt;T, E&gt;</text>
    <text x="650" y="450" transform="rotate(20, 650, 450)">'static</text>
    <text x="50" y="650" transform="rotate(45, 50, 650)">fn main()</text>
    <text x="650" y="700" transform="rotate(-15, 650, 700)">unsafe { }</text>
    <text x="150" y="800" transform="rotate(-30, 150, 800)">.unwrap()</text>
    <text x="550" y="280" opacity="0.15" font-size="26" transform="rotate(10, 550, 280)">#[derive(Debug)]</text>
  </g>

  <!-- Rust Sun/Gear -->
  <g transform="translate(400, 700) scale(7.5)" color="#00F0FF" filter="url(#gear-glow)">
    <path id="r" transform="translate(0.5, 0.5)" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" d="
      M -9,-15 H 4 C 12,-15 12,-7 4,-7 H -9 Z
      M -40,22 H 0 V 11 H -9 V 3 H 1 C 12,3 6,22 15,22 H 40
      V 3 H 34 V 5 C 34,13 25,12 24,7 C 23,2 19,-2 18,-2 C 33,-10 24,-26 12,-26 H -35
      V -15 H -25 V 11 H -40 Z" />
    <g id="gear" mask="url(#holes)">
      <circle r="43" fill="none" stroke="currentColor" stroke-width="9" />
      <g id="cogs">
        <use href="#cog" transform="rotate(0)" />
        <use href="#cog" transform="rotate(11.25)" />
        <use href="#cog" transform="rotate(22.50)" />
        <use href="#cog" transform="rotate(33.75)" />
        <use href="#cog" transform="rotate(45.00)" />
        <use href="#cog" transform="rotate(56.25)" />
        <use href="#cog" transform="rotate(67.50)" />
        <use href="#cog" transform="rotate(78.75)" />
        <use href="#cog" transform="rotate(90.00)" />
        <use href="#cog" transform="rotate(101.25)" />
        <use href="#cog" transform="rotate(112.50)" />
        <use href="#cog" transform="rotate(123.75)" />
        <use href="#cog" transform="rotate(135.00)" />
        <use href="#cog" transform="rotate(146.25)" />
        <use href="#cog" transform="rotate(157.50)" />
        <use href="#cog" transform="rotate(168.75)" />
        <use href="#cog" transform="rotate(180.00)" />
        <use href="#cog" transform="rotate(191.25)" />
        <use href="#cog" transform="rotate(202.50)" />
        <use href="#cog" transform="rotate(213.75)" />
        <use href="#cog" transform="rotate(225.00)" />
        <use href="#cog" transform="rotate(236.25)" />
        <use href="#cog" transform="rotate(247.50)" />
        <use href="#cog" transform="rotate(258.75)" />
        <use href="#cog" transform="rotate(270.00)" />
        <use href="#cog" transform="rotate(281.25)" />
        <use href="#cog" transform="rotate(292.50)" />
        <use href="#cog" transform="rotate(303.75)" />
        <use href="#cog" transform="rotate(315.00)" />
        <use href="#cog" transform="rotate(326.25)" />
        <use href="#cog" transform="rotate(337.50)" />
        <use href="#cog" transform="rotate(348.75)" />
      </g>
      <g id="mounts">
        <use href="#mount" transform="rotate(0)" />
        <use href="#mount" transform="rotate(72)" />
        <use href="#mount" transform="rotate(144)" />
        <use href="#mount" transform="rotate(216)" />
        <use href="#mount" transform="rotate(288)" />
      </g>
    </g>
  </g>

  <!-- Title Stack -->
  <g filter="url(#drop-shadow)">
    <text x="400" y="100" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="12" fill="#FFFFFF" letter-spacing="2" opacity="0.75">STEVE KLABNIK • CAROL NICHOLS • CHRIS KRYCHO • CONTRIBUTIONS FROM THE RUST COMMUNITY</text>
    <text x="400" y="180" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="800" font-size="80" fill="#FFFFFF" letter-spacing="4">THE RUST</text>
    <text x="400" y="240" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="28" fill="#00F0FF" letter-spacing="6">PROGRAMMING LANGUAGE</text>
    <text x="400" y="300" text-anchor="middle" font-family="'Poppins', sans-serif" font-weight="600" font-size="20" fill="#FF7B9C" letter-spacing="3">FEARLESS CONCURRENCY. SAFE MEMORY. HAPPY CRABS.</text>
  </g>

  <!-- Planet -->
  <g filter="url(#drop-shadow)">
    <path d="M -100 1100 Q 400 900 900 1100 L 900 1300 L -100 1300 Z" fill="url(#planetGrad)" />
    
    <!-- Planet Craters -->
    <g fill="#e43e5c" opacity="0.3">
      <ellipse cx="200" cy="1120" rx="80" ry="25" />
      <ellipse cx="650" cy="1080" rx="55" ry="18" />
      <ellipse cx="100" cy="1030" rx="30" ry="10" />
      <ellipse cx="750" cy="1160" rx="120" ry="35" opacity="0.6"/>
      <ellipse cx="450" cy="1180" rx="40" ry="12" />
    </g>
  </g>

  <!-- Ferris the Crab -->
  <g filter="url(#drop-shadow)">
    <!-- Shadow under Ferris -->
    <ellipse cx="400" cy="1030" rx="180" ry="25" fill="#cc3d41" opacity="0.8"/>

    <!-- Legs -->
    <g stroke="#E84D31" stroke-width="18" stroke-linecap="round" fill="none">
      <!-- Left legs -->
      <path d="M 230 960 Q 200 1010 170 1020" />
      <path d="M 260 980 Q 240 1030 220 1040" />
      <path d="M 310 990 Q 300 1040 300 1050" />
      <!-- Right legs -->
      <path d="M 570 960 Q 600 1010 630 1020" />
      <path d="M 540 980 Q 560 1030 580 1040" />
      <path d="M 490 990 Q 500 1040 500 1050" />
    </g>

    <!-- Body -->
    <ellipse cx="400" cy="900" rx="200" ry="130" fill="#E84D31"/>
    <ellipse cx="400" cy="920" rx="180" ry="110" fill="#F4664A"/>

    <!-- Eyes -->
    <circle cx="310" cy="850" r="40" fill="#FFF"/>
    <circle cx="490" cy="850" r="40" fill="#FFF"/>
    <!-- Pupils -->
    <circle cx="310" cy="850" r="18" fill="#140f2d"/>
    <circle cx="490" cy="850" r="18" fill="#140f2d"/>
    <!-- Catchlights -->
    <circle cx="305" cy="840" r="7" fill="#FFF"/>
    <circle cx="485" cy="840" r="7" fill="#FFF"/>

    <!-- Smile -->
    <path d="M 350 900 Q 400 960 450 900 Q 400 920 350 900 Z" fill="#140f2d"/>
    <!-- Tongue -->
    <path d="M 380 920 Q 400 940 420 920 Q 400 950 380 920 Z" fill="#FF7B9C"/>

    <!-- Claws (drawn last so they overlay the body nicely) -->
    <g transform="translate(140, 860) rotate(-45)">
       <path d="M 0 0 L -70 -45 A 90 90 0 1 1 -70 45 Z" fill="#E84D31" />
       <!-- Inside highlight for claw -->
       <path d="M -5 -5 L -55 -32 A 70 70 0 1 1 -55 32 Z" fill="#F4664A" />
    </g>
    <g transform="translate(660, 860) rotate(225)">
       <path d="M 0 0 L -70 -45 A 90 90 0 1 1 -70 45 Z" fill="#E84D31" />
       <!-- Inside highlight for claw -->
       <path d="M -5 -5 L -55 -32 A 70 70 0 1 1 -55 32 Z" fill="#F4664A" />
    </g>
  </g>
  
  <!-- Subtle vignette/border on the edges to center focus -->
  <rect width="800" height="1200" fill="none" stroke="#210f3c" stroke-width="20" opacity="0.6"/>
</svg>
